version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: paradox
      POSTGRES_PASSWORD: paradox
      POSTGRES_DB: paradox
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

volumes:
  pg_data:
